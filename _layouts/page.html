<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="icon" href="/reading-pencil/icon32.png">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f6f3ea; color: #26251f; font: 17px/1.65 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .sheet { max-width: 720px; margin: 40px auto 56px; background: #fcfcf9; border: 1px solid #e8e5da; border-radius: 14px; box-shadow: 0 2px 6px rgba(38,37,31,.06), 0 8px 22px rgba(38,37,31,.08); padding: 40px 48px 32px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  header a { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
  header b { font: 600 22px/1.2 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; }
  h1, h2, h3 { font-family: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif; line-height: 1.25; }
  h1 { font-size: 34px; margin: 18px 0 8px; }
  h2 { font-size: 23px; margin: 34px 0 6px; }
  h3 { font-size: 19px; margin: 24px 0 4px; }
  a { color: #8a5a00; text-underline-offset: 3px; }
  code, kbd { font: 14px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
  kbd { background: #fff; border: 1px solid #ddd8c9; border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
  table { border-collapse: collapse; width: 100%; margin: 10px 0; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #efede4; vertical-align: top; }
  th { font-size: 14px; color: #6b6960; font-weight: 600; }
  ul { padding-left: 22px; }
  li { margin: 4px 0; }
  .lede { font-size: 19px; color: #4a4840; }
  footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #efede4; font-size: 14px; color: #6b6960; display: flex; gap: 18px; }
  footer a { color: #6b6960; }
  @media (max-width: 640px) { .sheet { margin: 0; border-radius: 0; border: 0; padding: 26px 20px; } h1 { font-size: 28px; } }
</style>
</head>
<body>
<main class="sheet">
<header><a href="/reading-pencil/"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="44" height="44" aria-hidden="true"><g transform="translate(59.05 68.95) rotate(-45) translate(-67 0)"><rect x="116" y="-14" width="18" height="28" rx="6.3" fill="#F0899F"/><path d="M0 0 L34 -14 V14 Z" fill="#EEC999"/><path d="M0 0 L34 0 V14 Z" fill="#DDB27F"/><path d="M104 -14 H34 Q29.52 -9.33 34 -4.67 H104 Z" fill="#FFCD3C"/><path d="M104 -4.67 H34 Q29.52 0 34 4.67 H104 Z" fill="#F4B400"/><path d="M104 4.67 H34 Q29.52 9.33 34 14 H104 Z" fill="#DB9C00"/><path d="M0 0 L12.24 -5.04 V5.04 Z" fill="#2E2D2A"/><rect x="104" y="-14.5" width="15" height="29" fill="#C9CED5"/><rect x="107.6" y="-14.5" width="1.8" height="29" fill="#A3AAB3"/><rect x="113.6" y="-14.5" width="1.8" height="29" fill="#A3AAB3"/><rect x="104" y="6.3" width="15" height="8.2" fill="#A3AAB3" opacity="0.45"/></g></svg><b>Reading Pencil</b></a></header>
{{ content }}
<footer><a href="/reading-pencil/">How to use it</a><a href="/reading-pencil/privacy/">Privacy policy</a></footer>
</main>
</body>
</html>
